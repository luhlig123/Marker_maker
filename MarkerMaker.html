<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Marker Maker</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Open Sans";
    }

    #map {position: absolute; top: 0; bottom: 0; width: 100%;}

    #toggle-add {
        
        z-index: 10;
        margin: 10px;
    }

    #add-form {
        position: absolute;
        z-index: 10;
        margin-top: 10px;
        margin-left: 10px;
        margin-bottom: 10px;
        padding: 10px;
        padding-inline: 30px;
        width: 300px;
        height: 90%;
        background-color: white;
        color: black;
        resize: both;
        overflow: auto;
        border-radius: 15px;
        background-color: #d8ebf6;
    }

    #marker-panel {
        position: fixed;
        justify-content: center;
        bottom: 0;
        right: 0;
        margin: 10px;
        margin-bottom: 30px;
        z-index: 11;
        padding: 10px;
        width: 70%;
        height: 25%;
        background-color: white;
        color: black;
        overflow: auto;
        resize: both;
        direction: rtl;
        border-radius: 15px;
        background-color: #d8ebf6;
    }

    #Description {
        height: 200px;
        width: 100%;
        resize: none;
    }

    #type-box {
        border: 1px solid black;
        height: 100px;
        background-color: white;
        border-radius: 5px;
    }

    table {
        border: 1px solid black;
        width: 100%;
        background-color: white;
    }
    th, td {
        border: 1px solid black;
        background-color: white;
    }
</style>

<body>
    
    <div>
        <div id="map"></div>

        <div id="add-form">

            <button id="toggle-add">
                <p id="toggle-text">
                    Add Markers: OFF
                </p>
            </button>

            <h1>
                New Point Marker Form
            </h1>
            
            <p>
                <label for='Name'>Name: </label> 
                <input type='text' id='Name' name='Name' placeholder='Enter location name' required>
            </p>
            <p>
                <label for='Lng'>Lng: </label> 
                    <input type='text' id='Lng' name='Lng' placeholder='Enter Longitude' required>
            </p>
            <p>
                    <label for='Lat'>Lat: </label> 
                    <input type='text' id='Lat' name='Lat' placeholder='Enter Latitude' required>
            </p>

            <div id="type-box">
                <ul id="color-select">
                    <li>
                        <label for='Type'>Red</label> 
                        <input type='checkbox' id='Red' name='Red' value="red">
                    </li>
                    <li>
                        <label for='Type'>Green</label> 
                        <input type='checkbox' id='Green' name='Green' value="green">
                    </li>
                    <li>
                        <label for='Type'>Blue</label> 
                        <input type='checkbox' id='Blue' name='Blue' value="blue">
                    </li>
                </ul>
            </div>

            <p>
                <label for='Description'>Description: </label> 
                <br>
                <textarea id='Description' name='Description' placeholder='Enter description here'></textarea>
            </p>

            <button id="add-marker">
                Add Marker
            </button>
        </div>

        
        <div id="marker-panel">
            <div style="direction: ltr;">
                <h1 style="direction: ltr;">
                    Saved Markers
                </h1>

                <button>Export Data</button>

                <label for='Zoom_control'>Zoom Level: </label> 
                <input type='text' id='zoom-control' name='Zoom_control' placeholder='Enter zoom level' required value="15">

                <table id="marker-table">
                    <tr>
                        <th>fly to</th>
                        <th>Name</th>
                        <th>Lng</th>
                        <th>Lat</th>
                        <th>Description</th>
                    </tr>
                </table>
            </div>
        </div>
    

        
    </div>

</body>
